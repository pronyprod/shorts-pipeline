name: Health check and catch-up

# The pipeline's heartbeat (no Claude; owner 27 Nov 2026). GitHub drops or delays many scheduled runs (24-27 Nov:
# the hourly Reels job ran 4 times in 60 h), so this one cheap job does all routine work and is started three ways:
# its own hourly schedule (odd minute), every finished episode run (episode.yml), and by hand. Each run:
#   1. catch-up: a channel with nothing for tomorrow gets its episode run started (ci/health.mjs catchup)
#   2. upload watchdog: every queue row added 3+ h ago must be on YouTube; missing ones are re-queued (youtube.mjs)
#   3. emergency: after 15:00 WIB (Fakta 12:00) an empty tomorrow with no held episode gets an evergreen episode
#   4. held stock is queued when the upload window allows (ci/stock.mjs queue-held; hard cap 5, stock cap 4)
#   5. the Reels job is started when its last run is over 75 min old
#   6. the morning check (once a day from 06:30 WIB): missed days, tomorrow, stock per channel, stops; an alert opens
#      the GitHub issue "Health alert" (GitHub emails the owner) and turns this run red
#   7. an open alert issue is closed with "auto-repair succeeded" once every channel is covered again
on:
  schedule:
    - cron: "37 * * * *"
    - cron: "11 23 * * *" # extra morning trigger (06:11 WIB)
    - cron: "53 7 * * *" # extra afternoon trigger (14:53 WIB)
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [auto, check, catchup]
        default: auto
      dry:
        description: "Dry run: report only (no issue, no log line, no run started, nothing queued)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Jakarta
      GH_TOKEN: ${{ github.token }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_COUNTRYBALLS: ${{ secrets.YT_REFRESH_COUNTRYBALLS }}
      YT_REFRESH_WHATIF: ${{ secrets.YT_REFRESH_WHATIF }}
      YT_REFRESH_FAKTA: ${{ secrets.YT_REFRESH_FAKTA }}
      MAX_UPLOADS_24H: ${{ vars.MAX_UPLOADS_24H || '4' }}
      DOUBLE_CHANNELS: ${{ vars.DOUBLE_CHANNELS || '' }}
      META_POSTING: ${{ vars.META_POSTING || 'off' }}
      STOCK: ${{ vars.STOCK || 'off' }}
      HEALTH_DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && 'true' || 'false' }}
      JOB: ${{ inputs.job || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 1. Catch-up (start the episode run of a channel with nothing for tomorrow)
        if: env.JOB != 'check'
        run: node ci/health.mjs catchup
      - name: 2. Upload watchdog (every queued video must be on YouTube)
        id: watchdog
        if: env.JOB == 'auto'
        run: |
          set +e
          if [ "$HEALTH_DRY" = true ]; then node ci/youtube.mjs missing; else node ci/youtube.mjs missing --fix; fi
          code=$?
          [ $code = 3 ] && echo "missing=true" >> "$GITHUB_OUTPUT"
          [ $code = 0 ] || [ $code = 3 ] || echo "::warning::upload watchdog failed (exit $code)"
          exit 0
      - name: 3. Emergency episode when tomorrow is still empty in the afternoon
        if: env.JOB == 'auto'
        run: node ci/health.mjs emergency
      - name: 4. Queue held stock when the upload window allows (not while an episode run delivers)
        if: env.JOB == 'auto' && env.STOCK == 'on' && env.HEALTH_DRY != 'true'
        run: |
          n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/episode.yml/runs?status=in_progress&per_page=1" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).total_count??0))')
          if [ "$n" != 0 ]; then echo "an episode run is in progress: queueing waits for the next run"; exit 0; fi
          node ci/stock.mjs queue-held || echo "::warning::queue-held failed"
      - name: 5. Reels job when it is overdue
        if: env.JOB == 'auto'
        run: node ci/health.mjs reels || true
      - name: 6. Morning check (once a day from 06:30 WIB; red + issue on a problem)
        id: check
        if: env.JOB == 'auto' || env.JOB == 'check'
        run: if [ "$JOB" = check ]; then node ci/health.mjs check; else node ci/health.mjs check --once; fi
      - name: 7. Close the alert issue when auto-repair worked
        if: always() && env.JOB == 'auto'
        run: node ci/health.mjs resolve || true
      - name: Commit the log and the stock files
        if: always() && env.HEALTH_DRY != 'true'
        run: |
          git add shared/PROJECT_LOG.md ci/stock/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -q -m "health: heartbeat (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do git pull -q --rebase "$REMOTE" main && git push -q "$REMOTE" HEAD:refs/heads/main && exit 0; sleep 20; done
          echo "::error::git push failed"; exit 1
