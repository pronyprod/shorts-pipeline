name: Weekly review

# Owner, 22 Nov 2026: every Sunday Claude reads the Tracking numbers, writes shared/WHAT_WORKS.md and leans the three
# topic banks towards what works (ci/WEEKLY_REVIEW.md). Runs on Sunday morning, far from the nightly episode runs.
on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 09:00 WIB
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: commit to a test/... branch instead of main"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # claude-code-action

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Jakarta
      TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Export Tracking + Uploads
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node ci/review-data.mjs
          printf '{ "test": %s, "date": "%s" }\n' "$TEST" "$(date +%F)" > ci-out/context.json

      - name: Claude reviews and leans the banks
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Weekly review. Test run: ${{ env.TEST }}
            Read ci/WEEKLY_REVIEW.md first and follow it exactly. Input: ci-out/review/episodes.json.
            Always leave ci-out/review/result.json.
          claude_args: |
            --permission-mode default
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
            --max-turns 120

      - name: Only the allowed files changed?
        run: |
          git status --short
          bad=$(git status --porcelain | awk '{print $2}' | grep -vE '^(shared/WHAT_WORKS\.md|shared/(FLAG_PAIR|WHATIF|FAKTA)_BANK\.md|shared/PROJECT_LOG\.md|ci-out/.*)$' || true)
          if [ -n "$bad" ]; then echo "::error::the review changed files it must not touch: $bad"; git checkout -- $bad 2>/dev/null || true; exit 1; fi
          [ -f ci-out/review/result.json ] || { echo "::error::no ci-out/review/result.json"; exit 1; }

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          die() { echo "::error title=Commit step::$1"; exit 1; }
          git add shared/WHAT_WORKS.md shared/*_BANK.md shared/PROJECT_LOG.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          bash tools/scan.sh > "$RUNNER_TEMP/scan.txt" 2>&1 || { cat "$RUNNER_TEMP/scan.txt"; die "secrets scan failed"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          GIT="git -c http.https://github.com/.extraheader= -c credential.helper="
          if [ "$TEST" = true ]; then
            BRANCH="test/weekly-review-$GITHUB_RUN_ID"
            git checkout -q -b "$BRANCH"; git commit -q -m "TEST weekly review $GITHUB_RUN_ID"
            $GIT push -q "$REMOTE" "HEAD:refs/heads/$BRANCH" || die "push failed"
            echo "Test changes are on branch \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "weekly review $(date +%F)"
            for i in 1 2 3; do $GIT pull -q --rebase "$REMOTE" main && $GIT push -q "$REMOTE" HEAD:refs/heads/main && exit 0; sleep 20; done
            die "push failed"
          fi
