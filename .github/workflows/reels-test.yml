name: Reels version test

# Tests ci/reels-audio.mjs on the runner without Claude or Gemini: the three older episodes whose voice files are in
# git (Country Flux Ep011, PomProds Ep013, Fakta Ep013) get a Reels version with CC BY music from their published MP4.
# The files are kept as a run artifact (14 days) to listen to; nothing is released or posted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: countryballs, project: countryballs-video, episode: Ep011, composition: Ep011, file: Ep011.mp4, url: "https://drive.google.com/uc?export=download&id=13sCdixSvX82APU3Vjf7nZhxiflYoPF32" }
          - { channel: whatif, project: whatif-video, episode: Ep013, composition: Kit-k013, file: WhatIf_Ep013.mp4, url: "https://drive.google.com/uc?export=download&id=19Tz1O-pRm_I3RE0vLz_ZdqClrB20W8dI" }
          - { channel: fakta, project: fakta-video, episode: Ep013, composition: Fakta-Ep013, file: Fakta_Ep013.mp4, url: "https://drive.google.com/uc?export=download&id=1pookVN8OfTOKroUIC8E3WxZPWL7d9XZj" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: System packages (ffmpeg, what headless Chrome needs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libdrm2 libegl1 libgl1 libgles2
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 || sudo apt-get install -y -qq --no-install-recommends libasound2
      - name: npm ci
        working-directory: ${{ matrix.project }}
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Published MP4
        run: |
          mkdir -p ci-out/src
          curl -sfL -o "ci-out/src/${{ matrix.file }}" "${{ matrix.url }}"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "ci-out/src/${{ matrix.file }}"
      - name: Reels version
        run: |
          node ci/reels-audio.mjs --channel ${{ matrix.channel }} --episode ${{ matrix.episode }} --mp4 "ci-out/src/${{ matrix.file }}" --composition ${{ matrix.composition }}
          ffprobe -v error -show_entries format_tags=comment -of default=nw=1 ci-out/reels/*.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-${{ matrix.channel }}-${{ matrix.episode }}
          path: ci-out/reels/*.mp4
          retention-days: 14
