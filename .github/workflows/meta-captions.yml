name: Reels captions

# Claude writes the Instagram/Facebook captions for the next Reels (rules: ci/CAPTIONS.md): a trend-adjacent variant
# and a plain variant per episode, into ci/meta/captions/. ci/meta.mjs validates them and posts them (meta-post.yml).
# Daily 07:00 WIB (before the first Reels run at 08:10) and 15:00 WIB (fresh trends for the afternoon posts).
# Only the next 2-3 episodes per channel whose caption file is missing or over 48 h old are written.
on:
  schedule:
    - cron: "0 0 * * *" # 07:00 WIB
    - cron: "0 8 * * *" # 15:00 WIB
  workflow_dispatch:
    inputs:
      test:
        description: "Test: write the captions on a test branch (main and the posts are untouched)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # claude-code-action

concurrency:
  group: meta-captions
  cancel-in-progress: false

jobs:
  captions:
    if: github.event_name == 'workflow_dispatch' || (vars.META_POSTING == 'on' && vars.META_CAPTIONS != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'true' || 'false' }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Which episodes need a caption?
        id: todo
        run: |
          mkdir -p ci-out ci/meta/captions
          node ci/meta.mjs todo > ci-out/caption-todo.json
          N=$(node -p 'require("./ci-out/caption-todo.json").length')
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Episodes to caption: $N ($(node -p 'require("./ci-out/caption-todo.json").map(t=>t.channel+" "+t.episode).join(", ")'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Claude writes the captions
        if: steps.todo.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read ci/CAPTIONS.md and follow it exactly, including "How to work": research the current trends
            with web searches FIRST (ci-out/trends.md), then write one caption file for every entry in
            ci-out/caption-todo.json (the "file" field), then ci-out/caption-notes.md. Current date and time:
            run `date`. A trend hook needs a true, real link and must pass every hard rule; otherwise "trend": null.
            Write the plain captions yourself (do not copy plainFallback). Only write files under
            ci/meta/captions/ and ci-out/.
          claude_args: |
            --permission-mode default
            --allowedTools Bash,Read,Write,Glob,Grep,WebSearch,WebFetch
            --max-turns 80
      - name: Why did Claude stop? (only when the Claude step failed)
        if: always() && steps.todo.outputs.n != '0' && failure()
        run: node ci/claude-error.mjs || true
      - name: Check the captions (a broken variant is removed; the plain caption is used instead)
        if: always() && steps.todo.outputs.n != '0'
        run: |
          node ci/meta.mjs check-captions | tee -a "$GITHUB_STEP_SUMMARY"
          for f in ci-out/trends.md ci-out/caption-notes.md; do [ -f "$f" ] && { echo; echo "### $f"; cat "$f"; } | tee -a "$GITHUB_STEP_SUMMARY"; done
          for f in ci/meta/captions/*.json; do [ -f "$f" ] || continue; echo; echo "### $f"; node -e 'const j=require("./"+process.argv[1]);for(const pf of ["instagram","facebook"])for(const v of ["trend","plain"])if(j[pf]?.[v])console.log(`--- ${pf} ${v}\n${j[pf][v]}`);if(j.trend)console.log(`--- trend: ${j.trend.source} | ${j.trend.sourceUrl} | ${j.trend.why}`)' "$f"; done
      - name: Only caption files changed?
        if: always() && steps.todo.outputs.n != '0'
        run: |
          git add -A ci/meta/captions
          OTHER=$(git status --porcelain | grep -v ' ci/meta/captions/' | grep -v ' ci-out/' || true)
          if [ -n "$OTHER" ]; then echo "::error::files outside ci/meta/captions changed: $OTHER"; git checkout -- . ; git clean -fdq -- . ':!ci/meta/captions' ':!ci-out'; fi
      - name: Commit the captions
        if: always() && steps.todo.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A ci/meta/captions
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/scan.sh || { echo "::error::secrets scan failed"; exit 1; }
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          GIT="git -c http.https://github.com/.extraheader= -c credential.helper="
          if [ "$TEST" = true ]; then
            B="test/captions-$GITHUB_RUN_ID"; git checkout -q -b "$B"; git commit -q -m "TEST captions (run $GITHUB_RUN_ID)"
            $GIT push -q "$REMOTE" "HEAD:refs/heads/$B" && echo "Test captions on branch \`$B\`" >> "$GITHUB_STEP_SUMMARY"; exit
          fi
          git commit -q -m "reels: captions (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do $GIT pull -q --rebase "$REMOTE" main && $GIT push -q "$REMOTE" HEAD:refs/heads/main && exit 0; sleep 20; done
          echo "::error::git push failed"; exit 1
