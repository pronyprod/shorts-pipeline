name: Daily episode

# One channel per run, in two rounds (owner, 21 Nov 2026: 3-day stock). Round 1 makes the channel's episode
# (always when nothing is queued for tomorrow); round 2 makes a second one only when ci/stock.mjs says the channel is
# below the 3-day target and every limit allows it (uploads in 24 h, Gemini quota with 3 spare, time, Country Flux
# first). Stock building is on when the repository variable STOCK is "on". Jobs never overlap (concurrency group).
# Schedule (WIB = UTC+7): countryballs 19:20, PomProds 20:20, Fakta 21:20.
# The schedule only does work when the repository variable CLOUD_SCHEDULE is set to "on"
# (Settings > Secrets and variables > Actions > Variables). Until then the laptop stays in charge
# and only the manual "Run workflow" button does anything.
on:
  schedule:
    - cron: "20 12 * * *" # countryballs 19:20 WIB
    - cron: "20 13 * * *" # whatif 20:20 WIB
    - cron: "20 14 * * *" # fakta 21:20 WIB
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        type: choice
        required: true
        options: [countryballs, whatif, fakta]
      test:
        description: "Test mode: write to the 'Queue Test' tab, pre-release, test branch (nothing reaches Zapier or main)"
        type: boolean
        default: true
      redo:
        description: "Redo an episode that is already queued (e.g. Ep015): fix it, re-render, new release, old rows marked REMOVED. Empty = make the next episode."
        type: string
        default: ""
      redo_note:
        description: "Redo: what the owner wants fixed"
        type: string
        default: ""
      stock_test:
        description: "Test mode only: force the second (stock) episode, ignoring the target and order gates"
        type: boolean
        default: false

permissions:
  contents: write # commit state back, create releases
  id-token: write # needed by claude-code-action
  actions: write # the last round starts the health job (heartbeat, 27 Nov 2026)

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  episode:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      max-parallel: 1 # round 2 starts after round 1 has delivered and committed
      fail-fast: false
      matrix:
        round: [1, 2]
    env:
      TZ: Asia/Jakarta
      CHANNEL: ${{ inputs.channel || (github.event.schedule == '20 12 * * *' && 'countryballs') || (github.event.schedule == '20 13 * * *' && 'whatif') || 'fakta' }}
      TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'true' || 'false' }}
      REDO: ${{ github.event_name == 'workflow_dispatch' && inputs.redo || '' }}
      REDO_NOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.redo_note || '' }}
      ROUND: ${{ matrix.round }}
      STOCK: ${{ vars.STOCK || 'off' }}
      STOCK_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.test && inputs.stock_test) && 'true' || 'false' }}
      MAX_UPLOADS_24H: ${{ vars.MAX_UPLOADS_24H || '4' }}
      NEW_FORMATS: ${{ vars.NEW_FORMATS || 'off' }}
      DOUBLE_CHANNELS: ${{ vars.DOUBLE_CHANNELS || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # round 2 builds on round 1's commit: main, or round 1's test branch in a test run
          ref: ${{ matrix.round == 2 && (env.TEST == 'true' && format('test/{0}-{1}-r1', env.CHANNEL, github.run_id) || 'main') || '' }}
          fetch-depth: 0 # full history (without file contents) so ci/stop-retry.mjs can see whether a fix landed
          filter: blob:none

      - name: Run start time and project folder
        run: |
          echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          case "$CHANNEL" in
            countryballs) echo "PROJECT=countryballs-video" >> "$GITHUB_ENV" ;;
            whatif) echo "PROJECT=whatif-video" >> "$GITHUB_ENV" ;;
            fakta) echo "PROJECT=fakta-video" >> "$GITHUB_ENV" ;;
          esac
          echo "WIP_PREFIX=wip-$([ "$TEST" = true ] && echo test-)$CHANNEL-" >> "$GITHUB_ENV"
          echo "Channel: $CHANNEL, test: $TEST, round: $ROUND" >> "$GITHUB_STEP_SUMMARY"

      - name: Secrets present?
        env:
          A: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          B: ${{ secrets.GOOGLE_SA_JSON }}
          C: ${{ secrets.SHEET_ID }}
          D: ${{ secrets.ASSETS_KEY }}
          E: ${{ secrets.GEMINI_API_KEY }}
        run: |
          miss=""
          [ -n "$A" ] || miss="$miss CLAUDE_CODE_OAUTH_TOKEN"
          [ -n "$B" ] || miss="$miss GOOGLE_SA_JSON"
          [ -n "$C" ] || miss="$miss SHEET_ID"
          [ -n "$D" ] || miss="$miss ASSETS_KEY"
          if [ "$CHANNEL" != countryballs ] && [ -z "$E" ]; then miss="$miss GEMINI_API_KEY"; fi
          if [ -n "$miss" ]; then echo "::error::Missing repository secrets:$miss"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.PROJECT }}/package-lock.json

      - name: Make an episode in this round? (3-day stock plan and limits)
        id: plan
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a held stock episode of this channel is queued first when nothing is queued for tomorrow
          if [ "$ROUND" = 1 ] && [ -z "$REDO" ]; then node ci/stock.mjs queue-held --channel "$CHANNEL" --only-if-needed; fi
          node ci/stock.mjs plan
          if grep -q '^make=true' "$GITHUB_OUTPUT"; then echo "GO=true" >> "$GITHUB_ENV"; else echo "GO=false" >> "$GITHUB_ENV"; fi
          echo "KIND=$(sed -n 's/^kind=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_ENV"
          echo "COVERED=$(sed -n 's/^covered=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_ENV"

      - name: Spreadsheet access and publish time (decided at the START of the run)
        id: ctx
        if: env.GO == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node ci/sheet.mjs check
          # A resumed episode keeps its state publishAt only while it is still ahead; a passed one is recomputed
          # with the normal rule (day after the latest queued date, or run start date + 1).
          if [ -n "$REDO" ]; then
            [[ "$REDO" =~ ^Ep[0-9]{3}$ ]] || { echo "::error::redo must look like Ep015"; exit 1; }
            [ -n "$REDO_NOTE" ] || { echo "::error::redo needs redo_note (what to fix)"; exit 1; }
            [ ! -f "$PROJECT/.episode_state.json" ] || { echo "::error::an unfinished episode is in progress for $CHANNEL; finish it before a redo"; exit 1; }
            PUBLISH_AT="$(node ci/sheet.mjs publish-at --channel "$CHANNEL" --redo "$REDO")"
          else
            PUBLISH_AT="$(node ci/sheet.mjs publish-at --channel "$CHANNEL" --state "$PROJECT/.episode_state.json")"
          fi
          echo "PUBLISH_AT=$PUBLISH_AT" >> "$GITHUB_ENV"
          mkdir -p ci-out
          # new formats (series, PomProds Stories): on in TEST runs, else only when the repository variable NEW_FORMATS is "on"
          NEWF=$( { [ "$TEST" = true ] || [ "$NEW_FORMATS" = on ]; } && echo true || echo false)
          printf '{ "channel": "%s", "test": %s, "runStart": "%s", "publishAt": "%s", "newFormats": %s, "kind": "%s" }\n' "$CHANNEL" "$TEST" "$RUN_START" "$PUBLISH_AT" "$NEWF" "$KIND" > ci-out/context.json
          if [ -n "$REDO" ]; then
            node -e 'const fs=require("fs");const f="ci-out/context.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.redo=process.argv[1];c.redoNote=process.argv[2];fs.writeFileSync(f,JSON.stringify(c,null,2))' "$REDO" "$REDO_NOTE"
          fi
          cat ci-out/context.json
          if [ -f "$PROJECT/.episode_state.json" ]; then
            node -e 'const f=process.argv[1],fs=require("fs"),s=JSON.parse(fs.readFileSync(f,"utf8"));if(s.publishAt!==process.argv[2]){console.log(`state publishAt ${s.publishAt} -> ${process.argv[2]}`);s.publishAt=process.argv[2];fs.writeFileSync(f,JSON.stringify(s,null,2)+"\n")}' "$PROJECT/.episode_state.json" "$PUBLISH_AT"
          fi
          echo "Publish time: $PUBLISH_AT" >> "$GITHUB_STEP_SUMMARY"

      - name: npm ci
        if: env.GO == 'true'
        working-directory: ${{ env.PROJECT }}
        env:
          # onnxruntime-node (Kokoro) tries to download a CUDA build we never use; on 18 Nov that download gave 404
          # and broke npm ci (run 44218429231). The CPU build ships inside the package.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm ci --no-audit --no-fund

      # whisper.cpp is compiled for the CPU features of the machine that builds it (AVX-512 etc.); a runner without
      # them crashed with "Illegal instruction" (18 and 21 Nov). So the cache is kept per CPU feature set.
      - name: CPU features (for the whisper cache)
        if: env.GO == 'true'
        run: echo "CPUKEY=$(grep -m1 '^flags' /proc/cpuinfo | grep -oE 'avx512[a-z_]*|avx2|fma|f16c' | sort -u | tr -d '\n' | md5sum | cut -c1-10)" >> "$GITHUB_ENV"

      - name: Cache whisper.cpp and its model
        if: env.GO == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/whisper
          key: whisper-1.5.5-${{ env.CHANNEL == 'countryballs' && 'base.en' || 'small' }}-${{ env.CPUKEY }}-v2

      - name: Cache Chrome for Remotion and the Kokoro voice model
        if: env.GO == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT }}/node_modules/.remotion
            ${{ env.PROJECT }}/node_modules/@huggingface/transformers/.cache
          key: nm-extras-${{ env.PROJECT }}-${{ hashFiles(format('{0}/package-lock.json', env.PROJECT)) }}-v1

      - name: Restore work in progress (voice takes, renders of an unfinished episode)
        if: env.GO == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PROJECT }}/renders
            ${{ env.PROJECT }}/public/voice
            ${{ env.PROJECT }}/public/voices
            ${{ env.PROJECT }}/tts-out
            ${{ env.PROJECT }}/data/tts
          key: ${{ env.WIP_PREFIX }}${{ github.run_id }}-r${{ matrix.round }}
          restore-keys: ${{ env.WIP_PREFIX }}

      - name: Set up the Linux tools (ffmpeg, whisper, Chrome, fonts, music)
        if: env.GO == 'true'
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: bash ci/setup.sh "$CHANNEL"

      - name: A delivery left over from an earlier run?
        id: pending
        if: env.GO == 'true'
        run: |
          if [ "$TEST" != true ] && [ -f "ci/pending/$CHANNEL.json" ]; then
            cp "ci/pending/$CHANNEL.json" ci-out/result.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Retrying the delivery of an episode made earlier; no new episode this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retry a stopped episode, park it after a second stop, or repair a parked one
        id: retry
        if: env.GO == 'true' && steps.pending.outputs.skip != 'true'
        run: node ci/stop-retry.mjs start

      - name: Claude makes the episode
        id: claude1
        if: env.GO == 'true' && steps.pending.outputs.skip != 'true' && steps.retry.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GEMINI_API_KEY: ${{ env.CHANNEL != 'countryballs' && secrets.GEMINI_API_KEY || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the catch-up job (ci/health.mjs) starts runs as the github-actions bot; without this the action refuses them
          # (runs 45606956358, 45677897481 on 25 Nov: "Workflow initiated by non-human actor")
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Channel: ${{ env.CHANNEL }}
            Test run: ${{ env.TEST }}

            Redo: ${{ env.REDO || 'no' }}

            Read ci/CLOUD_RULES.md first and follow it exactly. It tells you which files hold this channel's
            instructions and what is different on this Linux runner.
            ${{ env.REDO && 'This is a REDO of an episode that is already queued: follow the "Redo" section of CLOUD_RULES.md; the owner''s note is redoNote in ci-out/context.json.' || 'Make the next episode for this channel, unattended.' }}
            Always leave ci-out/result.json when you finish or stop. Every mandatory check must be run by you in this
            session and written into result.json with its numbers (CLOUD_RULES "Mandatory checks in the result file");
            the workflow measures the file again and refuses to release anything that is missing.
          claude_args: |
            --permission-mode default
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch
            --max-turns 400

      # PomProds: Claude hands the full render to the workflow (result "render"), because a background render dies
      # when the Claude session ends (run 44103438051, 17 Nov). The render runs here with no session to outlive.
      - name: Render handed over by Claude
        id: render
        if: env.GO == 'true' && steps.claude1.outcome == 'success'
        run: |
          ROOT="$GITHUB_WORKSPACE"
          STATUS="$(node -p 'try{require("./ci-out/result.json").status}catch{""}')"
          if [ "$STATUS" != render ]; then echo "handoff=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "handoff=true" >> "$GITHUB_OUTPUT"
          EP="$(node -p 'require("./ci-out/result.json").episode')"
          COMP="$(node -p 'require("./ci-out/result.json").composition')"
          fail() {
            printf '{ "status": "check-needed", "episode": "%s", "reason": "cloud render: %s" }\n' "$EP" "$1" > "$ROOT/ci-out/result.json"
            echo "CHECK NEEDED: PomProds $EP cloud render: $1; state kept at step 5, the next run renders again without new voice requests ($(date +%F), $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$ROOT/shared/PROJECT_LOG.md"
            echo "**CHECK NEEDED** PomProds $EP render: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$CHANNEL" = whatif ] || fail "render hand-off is only for PomProds"
          [[ "$EP" =~ ^Ep[0-9]{3}$ ]] || fail "bad episode name in result.json"
          [[ "$COMP" =~ ^Kit-k[0-9]{3}[a-z]?$ ]] || fail "bad composition name in result.json"
          cd "$ROOT/$PROJECT"
          OUT="renders/WhatIf_$EP.mp4"
          rm -f "$OUT"
          # Software WebGL is slow: a long per-frame timeout, two Chrome tabs on the 4-core runner, then one if that fails.
          for CONC in 2 1; do
            LOG="$ROOT/ci-out/render-$CONC.log"
            START=$(date +%s)
            CODE=0
            timeout 95m npx remotion render src/index.ts "$COMP" "$OUT" --gl=swangle --concurrency=$CONC --timeout=240000 > "$LOG" 2>&1 || CODE=$?
            MIN=$(( ($(date +%s) - START) / 60 ))
            echo "concurrency $CONC: exit $CODE after $MIN min"; tail -5 "$LOG"
            if [ $CODE -eq 0 ] && [ -s "$OUT" ]; then
              echo "Rendered $OUT in $MIN min (concurrency $CONC)" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$ROOT/ci-out/result.json" # Claude's part 2 writes the real result
              echo "rendered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ $CODE -eq 124 ]; then fail "render took over 95 minutes"; fi
            rm -f "$OUT"
          done
          fail "remotion render failed twice: $(grep -m1 -iE 'error' "$ROOT/ci-out/render-1.log" | cut -c1-150 | tr -d '"\')"

      - name: Claude finishes the episode (checks after the workflow's render)
        id: claude2
        if: env.GO == 'true' && steps.render.outputs.rendered == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the catch-up job (ci/health.mjs) starts runs as the github-actions bot; without this the action refuses them
          # (runs 45606956358, 45677897481 on 25 Nov: "Workflow initiated by non-human actor")
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Channel: ${{ env.CHANNEL }}
            Test run: ${{ env.TEST }}
            Part 2 of this run: the workflow has rendered the episode for you.

            Redo: ${{ env.REDO || 'no' }}

            Read ci/CLOUD_RULES.md first and follow it exactly, especially "Render hand-off, part 2" and
            "Mandatory checks in the result file". Resume from the state file and run EVERY mandatory check
            yourself on the new MP4 (voice/whisper, loudness, true peak, length, silence, line joins, facts, file)
            plus the visual sanity check on frames of every beat; write each into result.json with its numbers.
            The workflow measures the file again and refuses to release anything missing. Always leave
            ci-out/result.json when you finish or stop.
          claude_args: |
            --permission-mode default
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch
            --max-turns 300

      # The Claude action hides its output; when it fails, show only the final error text and sort it (usage limit or
      # not), so the log says why instead of "ended without a result file" (22 Nov 2026, runs 44944551689/44947130130).
      # Also when Claude ended normally but left no ci-out/result.json (PomProds 24 Nov, run 45300766976: 37 turns,
      # no error, no result file, and its last message was hidden): then its last message is shown too.
      - name: Why did Claude stop? (a Claude step failed, or left no result file)
        if: always() && env.GO == 'true' && (steps.claude1.outcome == 'failure' || steps.claude2.outcome == 'failure' || (steps.claude1.outcome == 'success' && hashFiles('ci-out/result.json') == ''))
        run: node ci/claude-error.mjs "${{ steps.claude2.outputs.execution_file || steps.claude1.outputs.execution_file }}" ${{ (steps.claude1.outcome == 'failure' || steps.claude2.outcome == 'failure') && '--failed' || '' }} || true

      - name: Verify the mandatory checks (Claude's numbers + the workflow's own measurements)
        id: verify
        if: always() && env.GO == 'true' && steps.ctx.outcome == 'success'
        run: node ci/verify.mjs

      # Instagram/Facebook get a Reels version with a CC BY 4.0 track instead of the YouTube Audio Library music
      # (owner, 23 Nov 2026; ci/reels-audio.mjs). It never blocks the YouTube delivery: a failure only means no Reels file.
      - name: Reels version with CC BY music (never blocks the YouTube delivery)
        if: always() && env.GO == 'true' && steps.ctx.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: node ci/reels-audio.mjs --from-result

      - name: Deliver (release, public download check, spreadsheet rows, log line)
        if: always() && env.GO == 'true' && steps.ctx.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node ci/deliver.mjs

      # (owner 27 Nov 2026) a run must always leave a result file with its reason, also when Claude wrote none:
      # a Claude usage limit -> "claude-limit" (never counted as a stop), anything else -> "check-needed"
      - name: Result file when Claude left none
        if: always() && env.GO == 'true' && steps.ctx.outcome == 'success'
        run: node ci/result-fallback.mjs

      - name: Remember a stop (the next run retries once; a second stop parks the episode and the next topic is made)
        if: always() && env.GO == 'true' && steps.ctx.outcome == 'success'
        env:
          FIX_MARK: ${{ steps.retry.outputs.fix_mark }}
          RETRY: ${{ steps.retry.outputs.retry }}
        run: node ci/stop-retry.mjs end

      - name: Commit state, log and bank changes
        if: always() && steps.plan.outcome == 'success' && (env.GO != 'true' || steps.ctx.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each failure names itself in a public annotation, so the reason is visible without opening the log.
          die() { echo "::error title=Commit step::$1"; exit 1; }
          # The Claude action changes git's login settings; push with the workflow's own token, explicitly.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          GIT="git -c http.https://github.com/.extraheader= -c credential.helper="
          git config user.name "github-actions[bot]" || die "git config failed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || die "git add failed"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          echo "Files in this commit:"; git diff --cached --name-status
          if ! bash tools/scan.sh > "$RUNNER_TEMP/scan.txt" 2>&1; then
            cat "$RUNNER_TEMP/scan.txt"
            die "secrets scan failed on: $(grep -oE '^[^:]+:[0-9]+' "$RUNNER_TEMP/scan.txt" | head -5 | tr '\n' ' ')"
          fi
          if [ "$TEST" = true ]; then
            BRANCH="test/$CHANNEL-$GITHUB_RUN_ID-r$ROUND"
            git checkout -q -b "$BRANCH" || die "could not create branch $BRANCH"
            git commit -q -m "TEST $CHANNEL run $GITHUB_RUN_ID round $ROUND ($KIND)" || die "git commit failed"
            $GIT push -q "$REMOTE" "HEAD:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.txt" || die "git push failed: $(tail -1 "$RUNNER_TEMP/push.txt" | cut -c1-160)"
            echo "Test changes are on branch \`$BRANCH\` (main is untouched)." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "$CHANNEL: daily run $GITHUB_RUN_ID round $ROUND ($KIND)" || die "git commit failed"
            $GIT pull -q --rebase "$REMOTE" main 2> "$RUNNER_TEMP/pull.txt" || die "git pull --rebase failed: $(tail -1 "$RUNNER_TEMP/pull.txt" | cut -c1-160)"
            $GIT push -q "$REMOTE" HEAD:refs/heads/main 2> "$RUNNER_TEMP/push.txt" || die "git push failed: $(tail -1 "$RUNNER_TEMP/push.txt" | cut -c1-160)"
          fi

      - name: Keep the MP4 as a download on this run (14 days)
        if: always() && env.GO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHANNEL }}-renders-${{ github.run_id }}-r${{ matrix.round }}
          path: |
            ${{ env.PROJECT }}/renders/*.mp4
            ci-out/render-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Unfinished work to keep for the next run?
        id: wip
        if: always() && env.GO == 'true'
        run: |
          if [ -f "$PROJECT/.episode_state.json" ] || [ -f "ci/pending/$CHANNEL.json" ] || ls "$PROJECT"/parked/Ep*.json >/dev/null 2>&1; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save work in progress
        if: always() && env.GO == 'true' && steps.wip.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.PROJECT }}/renders
            ${{ env.PROJECT }}/public/voice
            ${{ env.PROJECT }}/public/voices
            ${{ env.PROJECT }}/tts-out
            ${{ env.PROJECT }}/data/tts
          key: ${{ env.WIP_PREFIX }}${{ github.run_id }}-r${{ matrix.round }}

      # Heartbeat (owner 27 Nov 2026): GitHub drops many scheduled runs, so every finished episode run starts the
      # health job (catch-up, upload watchdog, held stock, Reels). Last round only, never in test mode.
      - name: Start the health job (heartbeat)
        if: always() && matrix.round == 2 && env.TEST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -w "health job dispatch: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/health.yml/dispatches" -d '{"ref":"main","inputs":{"job":"auto","dry":false}}' || true
